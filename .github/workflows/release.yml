name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Bump this component of the latest tag (ignored when Version is set, or when there are no tags yet)
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: Explicit version with no v prefix (for example 1.0.0). Leave empty to auto-bump.
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Resolve candidate version
    runs-on: ubuntu-latest
    outputs:
      previous: ${{ steps.version.outputs.previous }}
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Resolve next version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
          OVERRIDE: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "releases must be dispatched from refs/heads/main, not $GITHUB_REF" >&2
            exit 1
          fi
          override=$(printf '%s' "$OVERRIDE" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//;s/^v//')
          latest=$(git tag -l 'v[0-9]*' --sort=-v:refname | head -n1 || true)

          normalize() {
            local value=$1 major minor patch rest
            major=${value%%.*}
            rest=${value#"$major"}
            rest=${rest#.}
            if [ -z "$rest" ]; then printf '%s.0.0\n' "$major"; return; fi
            minor=${rest%%.*}
            patch=${rest#"$minor"}
            patch=${patch#.}
            [ -n "$patch" ] || patch=0
            printf '%s.%s.%s\n' "$major" "$minor" "$patch"
          }

          if [ -n "$override" ]; then
            version=$(normalize "$override")
          elif [ -z "$latest" ]; then
            version=1.0.0
          else
            current=$(normalize "${latest#v}")
            major=${current%%.*}
            rest=${current#*.}
            minor=${rest%%.*}
            patch=${rest#*.}
            case "$BUMP" in
              major) major=$((major + 1)); minor=0; patch=0 ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              patch) patch=$((patch + 1)) ;;
              *) echo "invalid bump: $BUMP" >&2; exit 1 ;;
            esac
            version=$major.$minor.$patch
          fi
          if ! printf '%s\n' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "invalid release version: $version" >&2
            exit 1
          fi
          tag=v$version
          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "tag already exists: $tag" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "previous=$latest" >> "$GITHUB_OUTPUT"

  macos-candidate:
    name: Build macOS arm64 candidate
    needs: version
    runs-on: macos-15
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Require Apple Silicon
        run: test "$(uname -m)" = arm64
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Test
        run: make test
      - name: Install libkrun
        run: |
          set -euo pipefail
          brew tap libkrun/krun
          brew trust libkrun/krun
          brew install --build-from-source libkrunfw
          brew install libkrun
          test "$(brew list --versions libkrun)" = 'libkrun 1.19.4'
          test "$(brew list --versions libkrunfw)" = 'libkrunfw 5.5.0'
      - name: Build candidate artifacts
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          make build IMAGE_ID="$TAG"
          mkdir -p dist
          tar -C bin -czf "dist/abox_${TAG}_darwin_arm64.tar.gz" abox abox-vmm
          install -m 0755 bin/abox-guest-linux-arm64 "dist/abox-guest_${TAG}_linux_arm64"
          (cd dist && shasum -a 256 "abox_${TAG}_darwin_arm64.tar.gz" \
            "abox-guest_${TAG}_linux_arm64" > SHA256SUMS.darwin)
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            dist/abox_${{ needs.version.outputs.tag }}_darwin_arm64.tar.gz
            dist/abox-guest_${{ needs.version.outputs.tag }}_linux_arm64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-candidate-${{ needs.version.outputs.tag }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  linux-candidate:
    name: Build Linux amd64 candidate on pinned Arch snapshot
    needs: version
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel@sha256:4894f5a268c696fad671966f383175a13faf433c9d9c88cdd4e32eaa2d18838b
    permissions:
      attestations: write
      contents: read
      id-token: write
    outputs:
      artifact: ${{ steps.package.outputs.artifact }}
      file: ${{ steps.package.outputs.file }}
      sha256: ${{ steps.package.outputs.sha256 }}
    steps:
      - name: Install pinned build dependencies
        run: |
          set -euo pipefail
          printf '%s\n' 'Server = https://archive.archlinux.org/repos/2026/09/17/$repo/os/$arch' > /etc/pacman.d/mirrorlist
          pacman -Syyu --noconfirm
          pacman -S --needed --noconfirm git curl ca-certificates pkgconf \
            fakeroot e2fsprogs \
            zstd python shadow util-linux binutils file
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install checksum/signature-pinned libkrun pair
        run: sh scripts/install-arch-libkrun.sh
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Build and package as an unprivileged user
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          useradd --create-home --shell /bin/bash abox-build
          chown -R abox-build:abox-build "$GITHUB_WORKSPACE"
          runuser -u abox-build -- env HOME=/home/abox-build PATH="$PATH" \
            GITHUB_WORKSPACE="$GITHUB_WORKSPACE" GITHUB_SHA="$GITHUB_SHA" TAG="$TAG" \
            sh -c '
              set -eu
              cd "$GITHUB_WORKSPACE"
              SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$GITHUB_SHA")
              export SOURCE_DATE_EPOCH
              sh scripts/check-libkrun.sh 1.19.4 libkrunfw.so.5
              CGO_ENABLED=1 make test
               CGO_ENABLED=1 make abox vmm guest GUEST_ARCH=amd64 IMAGE_ID="$TAG"
               make image GUEST_ARCH=amd64 IMAGE_ID="$TAG" IMAGE="$GITHUB_WORKSPACE/dist/abox-guest-linux-amd64.raw"
              sh scripts/package-linux-release.sh "$TAG" \
                "$GITHUB_WORKSPACE/dist/abox-guest-linux-amd64.raw" \
                "$GITHUB_WORKSPACE/dist/release"
            '
      - name: Verify and expose immutable candidate digest
        id: package
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          file="abox_${TAG}_linux_amd64.tar.gz"
          sha=$(sha256sum "dist/release/$file")
          sha=${sha%% *}
          expected=$(cut -d' ' -f1 "dist/release/$file.sha256")
          test "$sha" = "$expected"
          sh scripts/verify-linux-release.sh "dist/release/$file" "$sha" 1.19.4
          echo "artifact=linux-candidate-$TAG" >> "$GITHUB_OUTPUT"
          echo "file=$file" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: dist/release/${{ steps.package.outputs.file }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.package.outputs.artifact }}
          path: dist/release/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Verify provenance and publish
    needs: [version, macos-candidate, linux-candidate]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      attestations: read
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: macos-candidate-${{ needs.version.outputs.tag }}
          path: dist/macos
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: ${{ needs.linux-candidate.outputs.artifact }}
          path: dist/linux
      - name: Verify candidate provenance
        env:
          CANDIDATE_FILE: ${{ needs.linux-candidate.outputs.file }}
          CANDIDATE_SHA256: ${{ needs.linux-candidate.outputs.sha256 }}
          TAG: ${{ needs.version.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          candidate="dist/linux/$CANDIDATE_FILE"
          actual=$(sha256sum "$candidate")
          actual=${actual%% *}
          test "$actual" = "$CANDIDATE_SHA256"
          gh attestation verify "$candidate" --repo "$GITHUB_REPOSITORY" \
            --predicate-type https://slsa.dev/provenance/v1 \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-digest "$GITHUB_SHA"
          (cd dist/macos && shasum -a 256 -c SHA256SUMS.darwin)
          for subject in \
            "dist/macos/abox_${TAG}_darwin_arm64.tar.gz" \
            "dist/macos/abox-guest_${TAG}_linux_arm64"; do
            gh attestation verify "$subject" --repo "$GITHUB_REPOSITORY" \
              --predicate-type https://slsa.dev/provenance/v1 \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-digest "$GITHUB_SHA"
          done
      - name: Prepare release assets
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp dist/macos/abox_*_darwin_arm64.tar.gz release-assets/
          cp dist/macos/abox-guest_*_linux_arm64 release-assets/
          cp dist/linux/abox_*_linux_amd64.tar.gz release-assets/
          (cd release-assets && sha256sum * > SHA256SUMS)
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREVIOUS: ${{ needs.version.outputs.previous }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          {
            echo "## What's Changed"
            echo
            if [ -n "$PREVIOUS" ]; then
              git log --no-merges --pretty=format:'- %s (%h)' "$PREVIOUS..$GITHUB_SHA"
              echo
              echo
              echo "**Full Changelog**: https://github.com/$GITHUB_REPOSITORY/compare/$PREVIOUS...$TAG"
            else
              git log --no-merges --pretty=format:'- %s (%h)' "$GITHUB_SHA"
              echo
            fi
          } > "$RUNNER_TEMP/release-notes.md"
          gh release create "$TAG" \
            --draft \
            --title "ABox $TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --target "$GITHUB_SHA" \
            release-assets/*
          gh release edit "$TAG" --draft=false
