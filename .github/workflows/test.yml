name: test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: make test

      - name: Build abox
        run: go build -o /tmp/abox ./cmd/abox

      - name: Build guest
        run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o /tmp/abox-guest ./cmd/abox-guest
